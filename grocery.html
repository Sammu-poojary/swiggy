<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Instamart Groceries – FoodCart</title>
    <meta name="description"
        content="Shop fresh groceries, vegetables, fruits, dairy, snacks and more on FoodCart Instamart. Delivered in minutes.">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f7f8fa;
            margin: 0;
        }

        /* ── Top Bar ── */
        .grocery-topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #fff;
            border-bottom: 1px solid #ebebeb;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .grocery-topbar .back-btn {
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            color: #222;
            padding: 4px 8px;
            border-radius: 8px;
            transition: background 0.15s;
        }

        .grocery-topbar .back-btn:hover {
            background: #f0f0f0;
        }

        .grocery-topbar h1 {
            font-size: 1.15rem;
            font-weight: 700;
            margin: 0;
            flex: 1;
            color: #111;
        }

        .grocery-topbar .search-btn {
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            color: #555;
        }

        .cart-chip-top {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 90, 0, 0.08);
            border: 1.5px solid #ff5a00;
            border-radius: 999px;
            padding: 7px 16px;
            font-weight: 700;
            color: #ff5a00 !important;
            text-decoration: none !important;
            cursor: pointer;
            transition: background 0.2s;
        }

        .cart-chip-top:hover {
            background: rgba(255, 90, 0, 0.14);
        }

        /* ── Filter Bar ── */
        .filter-bar {
            background: #fff;
            border-bottom: 1px solid #ebebeb;
            padding: 10px 24px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            position: sticky;
            top: 61px;
            z-index: 90;
        }

        .filter-chip {
            background: #fff;
            border: 1.5px solid #d9d9d9;
            border-radius: 999px;
            padding: 6px 14px;
            font-size: 0.82rem;
            font-weight: 600;
            color: #333;
            cursor: pointer;
            transition: all 0.18s;
            white-space: nowrap;
        }

        .filter-chip:hover,
        .filter-chip.active {
            border-color: #ff5a00;
            color: #ff5a00;
            background: rgba(255, 90, 0, 0.05);
        }

        .filter-chip i {
            font-size: 0.75rem;
        }

        /* ── Layout ── */
        .grocery-layout {
            display: flex;
            min-height: calc(100vh - 120px);
        }

        /* ── Sidebar ── */
        .grocery-sidebar {
            width: 160px;
            min-width: 160px;
            background: #fff;
            border-right: 1px solid #ebebeb;
            padding: 16px 0;
            position: sticky;
            top: 120px;
            height: calc(100vh - 120px);
            overflow-y: auto;
        }

        .sidebar-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 14px 10px;
            cursor: pointer;
            transition: background 0.15s;
            border-left: 3px solid transparent;
            text-align: center;
        }

        .sidebar-item:hover {
            background: #fafafa;
        }

        .sidebar-item.active {
            border-left-color: #e91e8c;
            background: #fff5fb;
        }

        .sidebar-item.active .sidebar-label {
            color: #e91e8c;
            font-weight: 700;
        }

        .sidebar-thumb {
            width: 56px;
            height: 56px;
            object-fit: contain;
            border-radius: 12px;
            background: #f5f5f5;
            padding: 4px;
        }

        .sidebar-label {
            font-size: 0.72rem;
            font-weight: 600;
            color: #444;
            margin-top: 6px;
            line-height: 1.2;
        }

        /* ── Product Grid ── */
        .grocery-content {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: #fff;
            border-radius: 16px;
            border: 1px solid #ebebeb;
            overflow: hidden;
            transition: box-shadow 0.2s, transform 0.2s;
            position: relative;
        }

        .product-card:hover {
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.10);
            transform: translateY(-3px);
        }

        .product-card .add-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #fff;
            border: 2px solid #1e88e5;
            color: #1e88e5;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.18s, color 0.18s, transform 0.18s;
            z-index: 5;
            box-shadow: 0 2px 8px rgba(30, 136, 229, 0.15);
        }

        .product-card .add-btn:hover {
            background: #1e88e5;
            color: #fff;
            transform: scale(1.12);
        }

        .product-img-wrap {
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f9f9f9;
            overflow: hidden;
        }

        .product-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.25s;
        }

        .product-card:hover .product-img-wrap img {
            transform: scale(1.04);
        }

        .product-info {
            padding: 12px 14px 14px;
        }

        .delivery-time {
            font-size: 0.68rem;
            font-weight: 700;
            color: #888;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .product-name {
            font-size: 0.95rem;
            font-weight: 700;
            color: #111;
            margin-bottom: 3px;
            line-height: 1.25;
        }

        .product-desc {
            font-size: 0.75rem;
            color: #888;
            margin-bottom: 8px;
            line-height: 1.35;
        }

        .product-qty {
            font-size: 0.78rem;
            color: #333;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .product-qty i {
            font-size: 0.7rem;
        }

        .discount-tag {
            font-size: 0.72rem;
            font-weight: 700;
            color: #2e7d32;
            background: #e8f5e9;
            padding: 2px 8px;
            border-radius: 999px;
            display: inline-block;
            margin-bottom: 4px;
        }

        .price-row {
            display: flex;
            align-items: center;
            gap: 8px;
            border-top: 1px solid #f0f0f0;
            padding-top: 8px;
            margin-top: 4px;
        }

        .price-now {
            font-size: 0.92rem;
            font-weight: 800;
            color: #111;
        }

        .price-old {
            font-size: 0.8rem;
            color: #aaa;
            text-decoration: line-through;
        }

        /* ── Section heading in grid ── */
        .grid-section-title {
            grid-column: 1 / -1;
            font-size: 1.1rem;
            font-weight: 700;
            color: #111;
            margin-top: 8px;
            margin-bottom: 4px;
            padding-bottom: 6px;
            border-bottom: 2px solid #f0f0f0;
        }

        /* ── Responsive ── */
        @media(max-width: 768px) {
            .grocery-sidebar {
                width: 90px;
                min-width: 90px;
            }

            .sidebar-thumb {
                width: 40px;
                height: 40px;
            }

            .sidebar-label {
                font-size: 0.62rem;
            }

            .product-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 12px;
            }

            .grocery-content {
                padding: 12px;
            }
        }

        @media(max-width: 480px) {
            .product-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>

        <button class="filter-chip" onclick="this.classList.toggle('active')">Sort By <i

        </div>

        <!-- Product Grid -->
        <div class="grocery-content">

                <!-- Dynamically filled by JS -->
            </div>
        </div>

        // All categories for sidebar use
        const ALL_CATS = Object.entries(CATEGORIES).map(([key, val]) => ({
            key,
            label: val.label,
            thumb: val.thumb
        }));

        // ── Page Init ────────────────────────────────────────────────────────────────
        function getQueryParam(key) {
            return new URLSearchParams(window.location.search).get(key);
        }

        let currentCat = getQueryParam('cat') || 'fresh-vegetables';

        function renderSidebar() {
            const sidebar = document.getElementById('sidebarNav');
            sidebar.innerHTML = ALL_CATS.map(cat => `
        <div class="sidebar-item ${cat.key === currentCat ? 'active' : ''}"
             onclick="switchCategory('${cat.key}')">
            <span class="sidebar-label">${cat.label.replace('&', '&amp;')}</span>
        </div>
    `).join('');
        }

        function renderProducts() {
            const data = CATEGORIES[currentCat];
            if (!data) return;

            // Update page title
            document.getElementById('pageTitle').textContent = data.label;
            document.title = `${data.label} – FoodCart Instamart`;

            const grid = document.getElementById('productGrid');
            grid.innerHTML = `<div class="grid-section-title">${data.label}</div>` +
                data.products.map(p => `
        <div class="product-card">
            <button class="add-btn add-to-order"
                    data-name="${p.name}"
                    data-price="${p.price}"
                    title="Add to cart">
                <i class="bi bi-plus"></i>
            </button>
<div class="product-img-wrap">
    <img src="${p.img}" alt="${p.name}" loading="lazy">
</div>
            <div class="product-info">
                <div class="delivery-time"><i class="bi bi-lightning-fill me-1" style="color:#e91e8c;"></i>${p.time}</div>
                <div class="product-name">${p.name}</div>
                <div class="product-desc">${p.desc}</div>
                <div class="product-qty">${p.qty} ${p.qty.includes('kg') || p.qty.includes('g') || p.qty.includes('ml') || p.qty.includes('L') || p.qty.includes('pcs') || p.qty.includes('pc') ? '<i class="bi bi-chevron-down"></i>' : ''}</div>
                ${p.discount !== '0% OFF' ? `<span class="discount-tag">${p.discount}</span>` : ''}
                <div class="price-row">
                    <span class="price-pill price-now">₹${p.price}</span>
                    ${p.mrp !== p.price ? `<span class="price-old">₹${p.mrp}</span>` : ''}
                </div>
            </div>
        </div>
    `).join('');
        }

        function switchCategory(catKey) {
            currentCat = catKey;
            // Update URL without reload
            const url = new URL(window.location.href);
            url.searchParams.set('cat', catKey);
            window.history.replaceState({}, '', url.toString());
            renderSidebar();
            renderProducts();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Override handleCartActions to support grocery product cards
        document.addEventListener('DOMContentLoaded', () => {
            renderSidebar();
            renderProducts();
        });

        // Delegate add-to-cart for dynamically rendered cards
        document.addEventListener('click', (e) => {
            const btn = e.target.closest('.add-to-order');
            if (!btn) return;
            e.stopPropagation();

            const name = btn.dataset.name;
            const price = parseFloat(btn.dataset.price) || 0;
            if (!name) return;

            // Load cart and add
            const cartKey = 'foodcart-global-cart';
            let cart = [];
            try { cart = JSON.parse(localStorage.getItem(cartKey)) || []; } catch { cart = []; }

            const existing = cart.find(item => item.name === name);
            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({ name, price, quantity: 1, page: 'grocery' });
            }
            localStorage.setItem(cartKey, JSON.stringify(cart));

            // Trigger shared cart.js utilities
            if (typeof updateCartCount === 'function') updateCartCount();
            if (typeof renderCart === 'function') renderCart();
            if (typeof showGlobalToast === 'function') showGlobalToast(`"${name}" added to cart`);

            // Visual feedback on button
            btn.style.background = '#1e88e5';
            btn.style.color = '#fff';
            btn.innerHTML = '<i class="bi bi-check-lg"></i>';
            setTimeout(() => {
                btn.style.background = '';
                btn.style.color = '';
                btn.innerHTML = '<i class="bi bi-plus"></i>';
            }, 900);
        });
    </script>
